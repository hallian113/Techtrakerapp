name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  
  # ✅ FIXED: Location & GPS (Stable versions)
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.0.1
  
  # ✅ OpenStreetMap (FREE - No API Key)
  flutter_map: ^7.0.1
  latlong2: ^0.9.1
  cached_network_image: ^3.3.1
  
  # ✅ State Management
  provider: ^6.0.5
  
  # ✅ Date/Time Formatting
  intl: ^0.18.1
  
  # ✅ Local Storage
  shared_preferences: ^2.2.2
  geolocator_platform_interface: ^4.3.0
  firebase_auth: ^6.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true