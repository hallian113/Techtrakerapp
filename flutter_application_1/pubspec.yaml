name: tracking_app
description: "Premium Tech Tracking Application with Gold & Black Theme"
publish_to: 'none'
version: 1.0.0+15


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8
  
  # 🥇 Google Fonts
  google_fonts: ^6.2.1
  
  # 📅 Date/Time
  intl: ^0.19.0
  timezone: ^0.10.1
  # 📱 Permissions
  permission_handler: ^11.0.1
  
  # 💬 Toast
  fluttertoast: ^8.2.8
  
  # 🔥 Firebase
  firebase_core: ^3.9.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.4.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  # 📍 Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  
  # 🗺️ OpenStreetMap
  flutter_map: ^7.0.1
  latlong2: ^0.9.1
  cached_network_image: ^3.4.0
  
  # 📊 State Management
  provider: ^6.1.2
  
  # 💾 Local Storage
  shared_preferences: ^2.3.2
  
  # 🔄 BACKGROUND SERVICE
  
  # 📶 Utilities
  connectivity_plus: ^6.1.0
  loading_animation_widget: ^1.3.0
  
  # 🗄️ OFFLINE DATABASE
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  
  # ✨ Shimmer
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"